name: CARLA Integration Tests

on:
  push:
    branches: [ main, bump-0.2.0 ]
  pull_request:
    branches: [ main, bump-0.2.0 ]

jobs:
  carla-tests:
    runs-on: ubuntu-20.04
    timeout-minutes: 45

    env:
      CARLA_VERSION: "0.9.14"
      CARLA_DOWNLOAD_URL: "https://tiny.carla.org/carla-0-9-14-linux"
      CARLA_ROOT: "${{ github.workspace }}/_carla"
      START_CARLA_SERVER: "false"
      DISPLAY: ":99"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          use-mamba: true
          activate-environment: opencda
          auto-activate-base: false

      - name: Verify Python version
        shell: bash -l {0}
        run: |
          python --version
          which python
          conda info --envs

      - name: Free up disk space
        run: |
          echo "=== Initial disk usage ==="
          df -h
          
          # Remove unnecessary packages to free up space
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf "$AGENT_TOOLSDIRECTORY" || true
          
          # Clean package cache
          sudo apt-get autoremove -y
          sudo apt-get autoclean
          sudo apt-get clean
          
          # Clean docker if present
          docker system prune -af || true
          
          echo "=== Disk usage after cleanup ==="
          df -h

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libomp5 \
            libvulkan1 \
            mesa-vulkan-drivers \
            libgl1-mesa-glx \
            libglib2.0-0 \
            libsm6 \
            libxext6 \
            libxrender-dev \
            libfontconfig1 \
            libxrandr2 \
            libegl1-mesa \
            xvfb \
            ca-certificates \
            wget \
            curl
          
          # Clean up apt cache
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Set up virtual display
        run: |
          # Start Xvfb for headless operation
          sudo /usr/bin/Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
          sleep 3

      - name: Download and extract CARLA
        run: |
          echo "Creating CARLA directory at ${CARLA_ROOT}"
          mkdir -p "${CARLA_ROOT}"
          
          echo "Downloading CARLA ${CARLA_VERSION} from ${CARLA_DOWNLOAD_URL}..."
          wget --progress=dot:giga --timeout=60 --tries=3 "${CARLA_DOWNLOAD_URL}" -O /tmp/CARLA_${CARLA_VERSION}.tar.gz
          
          echo "Verifying downloaded file..."
          file /tmp/CARLA_${CARLA_VERSION}.tar.gz
          ls -lh /tmp/CARLA_${CARLA_VERSION}.tar.gz
          
          echo "Extracting CARLA archive..."
          tar -xzf /tmp/CARLA_${CARLA_VERSION}.tar.gz -C "${CARLA_ROOT}"
          
          # Clean up the downloaded archive to save space
          rm -f /tmp/CARLA_${CARLA_VERSION}.tar.gz
          
          echo "CARLA extraction completed. Contents of ${CARLA_ROOT}:"
          ls -lah "${CARLA_ROOT}"
          
          echo "Looking for CarlaUE4.sh specifically:"
          find "${CARLA_ROOT}" -name "CarlaUE4.sh" -type f

      - name: Install CARLA Python client
        shell: bash -l {0}
        run: |
          echo "Verifying Python version..."
          python -c "import sys; print(f'Python version: {sys.version}')"
          python -c "import sys; assert sys.version_info[:2] == (3,8), f'Expected Python 3.8, got {sys.version_info[:2]}'"
          
          echo "Installing CARLA Python package..."
          pip install --no-cache-dir carla==${CARLA_VERSION}
          
          echo "Verifying CARLA installation..."
          python -c "
          import carla
          import sys
          print(f'CARLA module location: {carla.__file__}')
          print(f'Python executable: {sys.executable}')
          print('CARLA client installation verified successfully!')
          "

      - name: Verify CARLA server installation
        run: |
          echo "Verifying CARLA server files..."
          
          # Check for main executable
          if [ -f "${CARLA_ROOT}/CarlaUE4.sh" ]; then
            echo "✓ Found CarlaUE4.sh at ${CARLA_ROOT}/CarlaUE4.sh"
          else
            echo "✗ CarlaUE4.sh not found. Directory contents:"
            find "${CARLA_ROOT}" -name "*Carla*" -o -name "*.sh" | head -20
            exit 1
          fi
          
          # Make executable if not already
          chmod +x "${CARLA_ROOT}/CarlaUE4.sh"
          
          # Check for other essential files
          if [ -d "${CARLA_ROOT}/CarlaUE4" ]; then
            echo "✓ Found CarlaUE4 directory"
          else
            echo "✗ CarlaUE4 directory not found"
            ls -la "${CARLA_ROOT}/"
            exit 1
          fi
          
          echo "CARLA server verification completed successfully!"

      - name: Upload CARLA logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: carla-logs
          path: |
            /tmp/carla_server.log
            /tmp/carla.log
          retention-days: 7