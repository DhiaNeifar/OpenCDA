name: CARLA Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    env:
      CARLA_VERSION: "0.9.14"
      CARLA_URL: "https://tiny.carla.org/carla-0-9-14-linux"
      CARLA_ROOT: "${{ github.workspace }}/_carla"
      START_CARLA_SERVER: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          use-mamba: true

      - name: Show Python
        shell: bash -l {0}
        run: python -V

      - name: Install Ubuntu libs CARLA needs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libomp5 libvulkan1 mesa-vulkan-drivers libgl1 libglib2.0-0 ca-certificates \
            xvfb
          sudo apt-get clean

      - name: Free up disk space
        run: |
          set -eux
          df -h .
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean
          docker system prune -af || true
          df -h .

      - name: Download CARLA ${{ env.CARLA_VERSION }}
        run: |
          mkdir -p "${CARLA_ROOT}"
          curl -L "${CARLA_URL}" -o /tmp/CARLA_${CARLA_VERSION}.tar.gz
          tar -xzf /tmp/CARLA_${CARLA_VERSION}.tar.gz -C "${CARLA_ROOT}" --strip-components=1
          ls -lah "${CARLA_ROOT}"

      - name: Install CARLA client from PyPI (match server)
        shell: bash -l {0}
        run: |
          python - <<'PY'
          import sys
          assert sys.version_info[:2] == (3,8), f"Need Python 3.8, got {sys.version}"
          PY
          pip install --no-cache-dir "carla==${CARLA_VERSION}"
          python - <<'PY'
          import carla, sys
          print("carla module path:", carla.__file__)
          print("python:", sys.version)
          PY

      - name: Verify CARLA server files exist
        run: |
          test -f "${CARLA_ROOT}/CarlaUE4.sh"
          echo "Found CarlaUE4.sh at ${CARLA_ROOT}"

      # OPTIONAL: boot server off-screen (slow on non-GPU runners)
      - name: Start CARLA server (off-screen)
        if: env.START_CARLA_SERVER == 'true'
        shell: bash -l {0}
        timeout-minutes: 5
        run: |
          set -euo pipefail
          export SDL_VIDEODRIVER=offscreen
          "${CARLA_ROOT}/CarlaUE4.sh" -RenderOffScreen -quality-level=Low -nosound -world-port=2000 > /tmp/carla.log 2>&1 &
          SERVER_PID=$!

          echo "Waiting for server on port 2000 ..."
          for i in {1..30}; do
            (echo > /dev/tcp/127.0.0.1/2000) >/dev/null 2>&1 && break || sleep 2
          done

          if ! (echo > /dev/tcp/127.0.0.1/2000) >/dev/null 2>&1; then
            echo "CARLA failed to start; last 100 lines of log:"
            tail -n 100 /tmp/carla.log || true
            exit 1
          fi

          python - <<'PY'
          import carla
          c = carla.Client("127.0.0.1", 2000)
          c.set_timeout(10.0)
          print("Connected to CARLA server. Version:", c.get_server_version())
          PY

          kill "${SERVER_PID}" || true
          wait "${SERVER_PID}" || true
